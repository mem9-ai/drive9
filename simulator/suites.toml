# Simulator suite manifest: which cases run in which tier.
# Run: drive9-simulator run-suite --manifest simulator/suites.toml --tier pr-gate --server …
# Case paths resolve as simulator/cases/<name>.t.

# ---- pr-gate: fast core (mock backend friendly) ----

[[case]]
name = "drive9/api-fs"
tier = "pr-gate"
no_mount = true

[[case]]
name = "drive9/cli-fs"
tier = "pr-gate"
no_mount = true

# ---- nightly: bigger / root-requiring community suites ----
[[case]]
name = "community/fstest-sqlite"
tier = "pr-gate-mount"
timeout = "10m"

[[case]]
name = "community/fstest-fsx"
tier = "pr-gate-mount"
timeout = "10m"

[[case]]
name = "webdev/save-then-read"
tier = "pr-gate-mount"

[[case]]
name = "webdev/exclusive-create"
tier = "pr-gate-mount"

[[case]]
name = "juicefs/rmr"
tier = "pr-gate-mount"

[[case]]
# real failing finding: observer cache flaps empty against the mock (see
# the case header) — nightly until understood, not a PR blocker
name = "juicefs/cache-consistency"
tier = "nightly"

[[case]]
name = "community/fstest-pjdfstest"
tier = "nightly"
timeout = "30m"
allow_other = true

[[case]]
name = "community/fstest-ltp"
tier = "nightly"
timeout = "45m"
allow_other = true

[[case]]
name = "webdev/fsync-cut"
tier = "nightly"

[[case]]
name = "webdev/response-lost"
tier = "nightly"

[[case]]
name = "webdev/cross-client-read"
tier = "nightly"

[[case]]
name = "webdev/cache-threshold"
tier = "nightly"

[[case]]
name = "juicefs/random-rw"
tier = "nightly"

[[case]]
name = "juicefs/random-stress"
tier = "nightly"

[[case]]
name = "juicefs/fsrand"
tier = "nightly"

[[case]]
name = "drive9/git-ops-fast-clone"
tier = "nightly"

# ---- bench: fstest benchmark suites under latency shaping (G6); metrics
# land in the run's fstest-*.json artifacts and perf_baseline.py compares
# them against the previous run's baseline ----
[[case]]
name = "community/fstest-fio"
tier = "bench"
timeout = "15m"

[[case]]
name = "community/fstest-smallfile"
tier = "bench"
timeout = "15m"

[[case]]
name = "community/fstest-mdtest"
tier = "bench"
timeout = "15m"
