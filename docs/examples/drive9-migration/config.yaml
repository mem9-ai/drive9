version: v4
drive9:
  endpoint: https://drive9.example.com
job_defaults:
  sync:
    grace_period: 60s
  performance:
    max_bytes_per_second: 104857600
    small_file_workers: 8
    large_file_workers: 2
spaces:
  user-a:
    credential_ref: user-a-owner-key
  user-b:
    credential_ref: user-b-owner-key
  user-c:
    credential_ref: user-c-owner-key
ebs_sources:
  - volume_id: vol-0a
    node_name: migration-node-a
    root: /mnt/ebs/vol-0a
    jobs:
      - job_id: vol-0a-user-a
        subpath: /A
        target:
          space_ref: user-a
          prefix: /
      - job_id: vol-0a-user-b
        subpath: /B
        target:
          space_ref: user-b
          prefix: /
      - job_id: vol-0a-user-c
        subpath: /C
        target:
          space_ref: user-c
          prefix: /
