# Single-PVC trial manifest. Apply it to the namespace that contains the PVC.
# Replace the endpoint, volume ID, Node name, PVC name, and Owner API key.
# Do not commit a real API key.
# Replace both image fields with one published v4-capable source tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: drive9-migration
data:
  # Allowed startup requests: SYNCING, DUAL_WRITE_REPAIRING, CUTOVER_READY.
  # Patch this value and rollout-restart the DaemonSet for each transition.
  phase: SYNCING
  config.yaml: |
    version: v4
    drive9:
      endpoint: https://drive9.example.com
    job_defaults:
      sync:
        grace_period: 60s
      performance:
        max_bytes_per_second: 104857600
        small_file_workers: 8
        large_file_workers: 2
    spaces:
      user-a:
        credential_ref: user-a-owner-api-key
      user-b:
        credential_ref: user-b-owner-api-key
    ebs_sources:
      - volume_id: vol-00000000000000000
        node_name: REPLACE_WITH_KUBERNETES_NODE_NAME
        root: /mnt/ebs/source
        jobs:
          - job_id: vol-00000000000000000-user-a
            subpath: /A
            target:
              space_ref: user-a
              prefix: /
          - job_id: vol-00000000000000000-user-b
            subpath: /B
            target:
              space_ref: user-b
              prefix: /
---
apiVersion: v1
kind: Secret
metadata:
  name: drive9-migration-credentials
type: Opaque
stringData:
  user-a-owner-api-key: REPLACE_WITH_USER_A_DRIVE9_OWNER_API_KEY
  user-b-owner-api-key: REPLACE_WITH_USER_B_DRIVE9_OWNER_API_KEY
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: drive9-migration
  labels:
    app.kubernetes.io/name: drive9-migration
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: single-pvc-trial
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: drive9-migration
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: single-pvc-trial
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drive9-migration
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: single-pvc-trial
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_KUBERNETES_NODE_NAME
      securityContext:
        # Deliberately omit fsGroup: changing ownership on an existing Source
        # PVC is outside the migration contract. See the Runbook root exception.
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: plan
          image: ghcr.io/drive9-ai/drive9-migration:REPLACE_WITH_V4_SOURCE_TAG
          imagePullPolicy: IfNotPresent
          args:
            - plan
            - -f
            - /etc/drive9-migration/config.yaml
          env:
            - name: DRIVE9_MIGRATION_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Restricted-root exception: required by the 0600 Secret and the
            # customer-approved Source permissions; both mounts remain read-only.
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/drive9-migration
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/drive9-migration
              readOnly: true
            - name: source
              mountPath: /mnt/ebs/source
              readOnly: true
      containers:
        - name: drive9-migration
          image: ghcr.io/drive9-ai/drive9-migration:REPLACE_WITH_V4_SOURCE_TAG
          imagePullPolicy: IfNotPresent
          args:
            - run
            - -f
            - /etc/drive9-migration/config.yaml
          env:
            - name: DRIVE9_MIGRATION_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Restricted-root exception: required by the 0600 Secret and the
            # customer-approved Source permissions; both mounts remain read-only.
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/drive9-migration
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/drive9-migration
              readOnly: true
            - name: source
              mountPath: /mnt/ebs/source
              readOnly: true
            - name: runtime
              mountPath: /run/drive9-migration
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: drive9-migration
        - name: credentials
          secret:
            secretName: drive9-migration-credentials
            defaultMode: 0600
        - name: source
          persistentVolumeClaim:
            claimName: replace-with-existing-ebs-pvc
            readOnly: true
        - name: runtime
          emptyDir: {}
