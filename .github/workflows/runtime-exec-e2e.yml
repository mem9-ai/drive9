name: Runtime Exec E2E

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: "Exact tidbcloud/fs ref containing the Runtime server under test"
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      server_ref:
        description: "Exact tidbcloud/fs ref containing the Runtime server under test"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  runtime-exec-visibility:
    name: Runtime exec visibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout drive9 client
        uses: actions/checkout@v4

      - name: Checkout drive9 server
        uses: actions/checkout@v4
        with:
          repository: tidbcloud/fs
          ref: ${{ inputs.server_ref }}
          path: runtime-server
          token: ${{ secrets.DRIVE9_GITHUB_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client fuse3 jq
          grep -qxF user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf

      - name: Build exact client and server heads
        run: |
          make build-cli
          make -C runtime-server build-server

      - name: Resolve the digest-pinned test image
        run: |
          set -euo pipefail
          docker pull busybox:1.36.1
          image="$(docker image inspect busybox:1.36.1 --format '{{index .RepoDigests 0}}')"
          case "$image" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "resolved image is not digest-pinned" >&2; exit 1 ;;
          esac
          profiles="$(jq -cn --arg image "$image" '[{
            id:"docker-baseline", profile:"baseline", baseline:true, image:$image,
            cpu_millis:500, memory_mb:128, pids:64, network:"none",
            max_timeout_ms:60000, max_output_bytes:1048576
          }]')"
          echo "DRIVE9_RUNTIME_DOCKER_PROFILES_JSON=$profiles" >> "$GITHUB_ENV"

      - name: Run bidirectional Runtime workspace visibility proof
        env:
          DRIVE9_RUNTIME_ENABLED: "true"
          DRIVE9_RUNTIME_MOUNT_BINARY: ${{ github.workspace }}/bin/drive9
          DRIVE9_RUNTIME_MOUNT_BASE_DIR: /tmp/drive9-runtime-mounts
          DRIVE9_RUNTIME_DRAIN_TIMEOUT: 30s
          DRIVE9_RUNTIME_JEV_MODE: "off"
          DRIVE9_S3_BACKEND: mock
          DRIVE9_SERVER_BIN: ${{ github.workspace }}/runtime-server/bin/drive9-server
          DRIVE9_CLI_BIN: ${{ github.workspace }}/bin/drive9
          DRIVE9_LOCAL_E2E_SMOKE_SCRIPT: e2e/runtime-exec-visibility.sh
        run: bash scripts/e2e-local.sh --no-build

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-exec-e2e-failure
          path: |
            /tmp/drive9-e2e.*/server.log
            /tmp/drive9-runtime-mounts
          if-no-files-found: ignore
          retention-days: 7
