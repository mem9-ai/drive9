name: Release CLI binaries

on:
  workflow_dispatch:

concurrency:
  group: release-cli
  cancel-in-progress: true

jobs:
  release:
    name: Build and Publish CLI
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        run: |
          SOURCE_SHA="${{ github.sha }}"
          VERSION="${SOURCE_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build CLI for all platforms
        # Close-sync mode optimization negotiates batch_write_mode_v1 at runtime.
        # Compatibility/rollout: docs/release-notes/2026-09-23-close-sync-create-mode.md
        run: |
          make build-cli-release DIST_DIR=dist VERSION="${{ env.VERSION }}" CLI_TARGETS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"

      - name: Build migration kubectl plugin for all platforms
        run: |
          make build-migration-kube-plugin-release DIST_DIR=dist VERSION="${{ env.VERSION }}" KUBE_PLUGIN_TARGETS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"

      - name: Verify Windows artifacts
        run: |
          test -f dist/drive9-windows-amd64.exe
          test -f dist/drive9-windows-arm64.exe
          test -f dist/kubectl-drive9-migration-windows-amd64.exe
          test -f dist/kubectl-drive9-migration-windows-arm64.exe

      - name: Ensure version file
        run: |
          echo "${{ env.VERSION }}" > dist/version

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum drive9-* kubectl-drive9-migration-* > SHA256SUMS
          sha256sum --check checksums.txt
          sha256sum --check migration-kube-plugin-checksums.txt
          cat SHA256SUMS

      - name: Sign release manifest
        # The CLI verifies this signature before installing: a manifest served by the same
        # origin as the binary proves integrity, not authenticity, so an unsigned release is
        # a release that cannot be updated to. Fail closed when the key is missing.
        env:
          DRIVE9_RELEASE_SIGNING_KEY: ${{ secrets.DRIVE9_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${DRIVE9_RELEASE_SIGNING_KEY}" ]; then
            echo "DRIVE9_RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned self-update manifest" >&2
            exit 1
          fi
          go run ./cmd/drive9-release-sign dist/checksums.txt dist/release.txt
          test -s dist/checksums.txt.sig
          test -s dist/release.txt.sig
          base64 -d dist/checksums.txt.sig | wc -c | grep -qx 64
          base64 -d dist/release.txt.sig | wc -c | grep -qx 64
          # Run the updater's own bundle check against the artifacts just signed: both
          # signatures against the keys this release's binary embeds (read from the same
          # file the build embeds), the digest binding release.txt to checksums.txt, and the
          # manifest structure. A stale or mistyped secret signs happily and would publish a
          # release no updated CLI can install; this step fails instead.
          # The key file is passed through untouched: normalizing its separators here would
          # check a key set the shipped binary never parses, so a file the binary cannot
          # read would publish a release that cannot update. One line per key is fine —
          # the parser accepts commas or whitespace.
          KEYS="$(cat cmd/drive9/cli/update_key.txt)"
          go run ./cmd/drive9-release-sign -verify-release -pubkey "$KEYS" dist/checksums.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      # Two passes, binaries first. The updater fetches the manifest and its signature as two
      # requests, and both sort ahead of the artifacts, so publishing manifests after the
      # binaries means a reader that sees a manifest can also read the artifacts it names.
      # Manifests get a short TTL so a rollback propagates quickly.
      - name: Upload CLI binaries to S3 (latest)
        run: |
          aws s3 sync dist/ s3://drive9-releases/latest/ \
            --exclude "*" \
            --include "drive9-*" \
            --include "kubectl-drive9-migration-*" \
            --cache-control "public, max-age=300" \
            --content-type "application/octet-stream" \
            --no-progress
          echo "Uploaded ${{ env.VERSION }} binaries to s3://drive9-releases/latest/"

      - name: Publish release manifests to S3 (latest, last)
        run: |
          aws s3 sync dist/ s3://drive9-releases/latest/ \
            --exclude "*" \
            --include "SHA256SUMS" \
            --include "checksums.txt" \
            --include "checksums.txt.sig" \
            --include "release.txt" \
            --include "release.txt.sig" \
            --include "migration-kube-plugin-checksums.txt" \
            --include "version" \
            --cache-control "public, max-age=60" \
            --content-type "application/octet-stream" \
            --no-progress
          echo "Published ${{ env.VERSION }} manifests to s3://drive9-releases/latest/"
          aws s3 ls s3://drive9-releases/latest/

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/latest/*" \
            --query 'Invalidation.Id' --output text)
          echo "Created invalidation ${INVALIDATION_ID} for /latest/*"
          # Don't block the workflow on propagation (30-60s typical, but can spike).
          # The invalidation is queued globally and will finish in the background.
