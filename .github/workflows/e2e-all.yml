name: e2e-all

# Manual one-click run of every e2e suite in e2e/ that can execute against the
# self-contained TiDB + drive9-server (provider=local) stack. Excluded by design (need)
# external infra): description-smoke-test.sh (Docker + Ollama/stub embedder).
# Full pjdfstest lives under blackbox (community.pjdfstest), not this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  all-e2e:
    uses: ./.github/workflows/local-e2e.yml
    with:
      run_all_e2e: "1"
    secrets: inherit
