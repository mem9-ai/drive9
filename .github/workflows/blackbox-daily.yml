name: Blackbox Daily

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-daily
  cancel-in-progress: false

jobs:
  blackbox:
    name: Blackbox Daily (community)
    uses: ./.github/workflows/blackbox.yml
    secrets: inherit
    with:
      group: community
      runs: "1"
