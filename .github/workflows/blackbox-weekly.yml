name: Blackbox Weekly

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-weekly
  cancel-in-progress: false

jobs:
  blackbox:
    name: Blackbox Weekly (community)
    uses: ./.github/workflows/blackbox.yml
    secrets: inherit
    with:
      group: community
      runs: "1"
