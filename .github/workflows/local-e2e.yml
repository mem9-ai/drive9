name: Local E2E

on:
  pull_request:
    branches:
      - main
      - 'perf/**'
    paths:
      - ".github/workflows/local-e2e.yml"
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/local-e2e.yml"
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Suite tier from tests/cases/suites.toml"
        required: false
        default: "pr"
        type: choice
        options:
          - "pr"
          - "pr-no-mount"
          - "pr-fuse"
          - "daily-fault"
          - "daily-fuse"
          - "daily-bench"
          - "daily"
      jobs:
        description: "Parallel case workers (--jobs)"
        required: false
        default: "4"
        type: string
      server:
        description: "Optional external drive9-server URL (omit to use built-in contract server)"
        required: false
        default: ""
        type: string

concurrency:
  group: local-e2e-${{ github.event_name == 'push' && 'main-post-merge' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  local-e2e:
    name: Local E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure FUSE3 & host tools
        run: |
          set -euo pipefail
          pkgs=()
          command -v fusermount3 >/dev/null || pkgs+=(fuse3)
          command -v getfattr >/dev/null || pkgs+=(attr)
          command -v sqlite3 >/dev/null || pkgs+=(sqlite3)
          if [ "${{ github.event_name }}" = "schedule" ] || [[ "${{ inputs.tier }}" == daily* ]]; then
            command -v setfacl >/dev/null || pkgs+=(acl)
            command -v zip >/dev/null || pkgs+=(zip)
            command -v unzip >/dev/null || pkgs+=(unzip)
          fi
          if [ "${#pkgs[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${pkgs[@]}"
          fi
          sudo sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf || echo "user_allow_other" | sudo tee -a /etc/fuse.conf

      - name: Build drive9 CLI
        run: make build-cli

      - name: Run kernel FUSE white-box Go tests
        if: inputs.tier != 'pr-no-mount'
        run: umask 022 && make test-fuse-kernel

      - name: Download prebuilt drive9-simulator via wget
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_URL: ${{ vars.SIMULATOR_DOWNLOAD_URL }}
          RELEASE_BASE: "https://github.com/${{ github.repository }}/releases/download/simulator-latest"
        run: |
          set -euo pipefail
          need_source_build=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only HEAD^1 HEAD -- tests/simulator/ 2>/dev/null | grep -q .; then
              echo "PR modifies tests/simulator/ -> building simulator from source"
              need_source_build=1
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --no-tags --depth=1 origin "${{ github.event.before }}" 2>/dev/null || true
            if git diff --name-only "${{ github.event.before }}..HEAD" -- tests/simulator/ 2>/dev/null | grep -q .; then
              echo "Push modifies tests/simulator/ -> building simulator from source"
              need_source_build=1
            fi
          fi

          if [ "$need_source_build" -eq 0 ]; then
            mkdir -p /tmp/sim-dl
            downloaded=0
            if [ -n "${CUSTOM_URL:-}" ]; then
              echo "Downloading prebuilt simulator via wget from ${CUSTOM_URL}..."
              if wget -qO /tmp/sim-dl/drive9-simulator-linux-amd64 "${CUSTOM_URL}"; then
                if wget -qO /tmp/sim-dl/drive9-simulator-linux-amd64.sha256 "${CUSTOM_URL}.sha256" 2>/dev/null; then
                  (cd /tmp/sim-dl && sha256sum -c drive9-simulator-linux-amd64.sha256)
                fi
                downloaded=1
              fi
            elif wget -qO /tmp/sim-dl/drive9-simulator-linux-amd64 "${RELEASE_BASE}/drive9-simulator-linux-amd64" 2>/dev/null \
              && wget -qO /tmp/sim-dl/simulator-checksums.txt "${RELEASE_BASE}/simulator-checksums.txt" 2>/dev/null; then
              (cd /tmp/sim-dl && grep "drive9-simulator-linux-amd64$" simulator-checksums.txt | sha256sum -c -)
              downloaded=1
            elif gh release download simulator-latest \
                --dir /tmp/sim-dl \
                --pattern "drive9-simulator-linux-amd64" \
                --pattern "simulator-checksums.txt" 2>/dev/null; then
              (cd /tmp/sim-dl && grep "drive9-simulator-linux-amd64$" simulator-checksums.txt | sha256sum -c -)
              downloaded=1
            fi

            if [ "$downloaded" -eq 1 ]; then
              chmod +x /tmp/sim-dl/drive9-simulator-linux-amd64
              /tmp/sim-dl/drive9-simulator-linux-amd64 --version
              echo "SIMULATOR_BIN=/tmp/sim-dl/drive9-simulator-linux-amd64" >> "$GITHUB_ENV"
              echo "used_prebuilt=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Prebuilt simulator not available yet; falling back to cargo build"
          fi
          echo "used_prebuilt=false" >> "$GITHUB_OUTPUT"

      - name: Setup Rust (when building simulator from source)
        if: steps.prebuilt.outputs.used_prebuilt != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache fstest target suite bundles (when building simulator from source)
        if: steps.prebuilt.outputs.used_prebuilt != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/fstest
          key: fstest-bundle-v3-linux-gnu-${{ hashFiles('tests/simulator/Cargo.lock') }}
          restore-keys: |
            fstest-bundle-v3-linux-gnu-

      - name: Build & unit-test drive9-simulator from source
        if: steps.prebuilt.outputs.used_prebuilt != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkgconf bison flex m4 xz-utils \
            zlib1g-dev libaio-dev libacl1-dev libattr1-dev libcap-dev libkeyutils-dev libnuma-dev uuid-dev libssl-dev
          FSTEST_SKIP_BUNDLE=1 cargo test --manifest-path tests/simulator/Cargo.toml
          cargo build --release --manifest-path tests/simulator/Cargo.toml
          echo "SIMULATOR_BIN=$(pwd)/tests/simulator/target/release/drive9-simulator" >> "$GITHUB_ENV"

      - name: Validate & run simulator suite
        run: |
          set -euo pipefail
          "$SIMULATOR_BIN" validate tests/cases
          SERVER_ARG=""
          if [ -n "${{ inputs.server }}" ]; then
            SERVER_ARG="--server ${{ inputs.server }}"
          fi
          JOBS="${{ inputs.jobs || '4' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            "$SIMULATOR_BIN" run-suite tests/cases/suites.toml \
              --tier daily-fault,daily-fuse \
              --jobs "$JOBS" \
              --fail-on-all-skip \
              --bin ./bin/drive9 \
              --home /tmp/sim-daily \
              $SERVER_ARG
            exit 0
          fi
          TIER="${{ inputs.tier || 'pr' }}"
          "$SIMULATOR_BIN" run-suite tests/cases/suites.toml \
            --tier "$TIER" \
            --jobs "$JOBS" \
            --fail-on-all-skip \
            --bin ./bin/drive9 \
            --home /tmp/sim-run \
            $SERVER_ARG

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-e2e-diagnostics
          path: |
            /tmp/sim-run/**
            /tmp/sim-daily/**
            !/tmp/sim-**/tenant.json
          if-no-files-found: ignore
