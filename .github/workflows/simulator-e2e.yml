name: simulator-e2e

# Simulator-based e2e (G4 of simulator/ROADMAP.md): the PR gate runs the
# pr-gate tier against the embedded mock backend (--stack mock = Go mock
# server over SQLite + rustfs via scripts/local-object-store.sh), plus a
# no-skip pjdfstest gate. Replaces local-e2e.yml as cases migrate; the daily
# real-backend action lands separately (G5).

on:
  pull_request:
    paths:
      - simulator/**
      - pkg/mockserver/**
      - cmd/drive9-mock-server/**
      - pkg/fuse/**
      - pkg/backend/**
      - pkg/client/**
      - scripts/local-object-store.sh
      - scripts/object-store-config.sh
      - .github/workflows/simulator-e2e.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: simulator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D9_REPO: ${{ github.workspace }}
      D9_MOCK_SERVER_BIN: ${{ github.workspace }}/bin/drive9-mock-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable user_allow_other for FUSE
        run: |
          grep -q '^user_allow_other' /etc/fuse.conf || \
            echo 'user_allow_other' | sudo tee -a /etc/fuse.conf

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y fuse3 fio

      - name: Restore perf baseline
        uses: actions/cache/restore@v4
        with:
          path: /tmp/perf-baseline.json
          key: perf-baseline-mock-${{ github.run_id }}
          restore-keys: perf-baseline-mock-

      - name: Build drive9 CLI + mock server
        run: |
          make build-cli CLI_BIN=bin/drive9
          CGO_ENABLED=0 go build -o bin/drive9-mock-server ./cmd/drive9-mock-server

      - name: Build simulator
        run: cargo build --release --manifest-path simulator/Cargo.toml

      - name: Ensure fstest
        # TODO(G6): pin a commit sha once fstest tags versions
        run: simulator/target/release/drive9-simulator tools --ensure-fstest main
        env:
          D9_FSTEST_BIN: ''

      - name: Run pr-gate tier — server-surface cases (no mount)
        run: |
          export PATH="$PWD/bin:$PATH"
          simulator/target/release/drive9-simulator run-suite simulator/suites.toml \
            --tier pr-gate --stack mock --stop-on-fail \
            --home /tmp/d9-suite-home

      - name: Run pr-gate-mount tier (FUSE cases inside a bounded container)
        # The mount tier runs inside a fuse-enabled container: identical to
        # the locally-verified environment, artifacts land on the host via
        # the volume, and a wedged FUSE daemon is contained by
        # `docker kill` (proven reliable) instead of holding the job
        # hostage (a D-state process survives even job cancellation).
        run: |
          mkdir -p /tmp/d9-mount-out
          timeout -k 15 1500 docker run --rm --name sim-mount-tier \
            --privileged --device /dev/fuse \
            -v "$PWD:/repo" -v /tmp/d9-mount-out:/out \
            -v ~/.cache/drive9-simulator:/root/.cache/drive9-simulator \
            ubuntu:24.04 bash -c '
              set -x
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 curl python3 >/dev/null
              export D9_MOCK_SERVER_BIN=/repo/bin/drive9-mock-server D9_REPO=/repo
              export D9_FSTEST_BIN=/root/.cache/drive9-simulator/fstest/main/target/release/fstest
              cd /repo
              rc=0
              timeout -k 10 1350 simulator/target/release/drive9-simulator run-suite simulator/suites.toml \
                --tier pr-gate-mount --stack mock --bin /repo/bin/drive9 --home /out/home || rc=$?
              chmod -R a+rX /out/home 2>/dev/null || true
              exit $rc
            ' || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" != 0 ]; then docker kill sim-mount-tier 2>/dev/null; exit $rc; fi

      - name: pjdfstest gate (no-skip, merge-blocking, containerized)
        run: |
          mkdir -p /tmp/d9-pjdf-out
          timeout -k 15 1800 docker run --rm --name sim-pjdfstest \
            --privileged --device /dev/fuse \
            -v "$PWD:/repo" -v /tmp/d9-pjdf-out:/out \
            -v ~/.cache/drive9-simulator:/root/.cache/drive9-simulator \
            ubuntu:24.04 bash -c '
              set -x
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 curl python3 >/dev/null
              export D9_MOCK_SERVER_BIN=/repo/bin/drive9-mock-server D9_REPO=/repo
              export D9_FSTEST_BIN=/root/.cache/drive9-simulator/fstest/main/target/release/fstest
              cd /repo
              rc=0
              timeout -k 10 3300 simulator/target/release/drive9-simulator run \
                simulator/cases/community/fstest-pjdfstest.t \
                --stack mock --allow-other --timeout 50m --bin /repo/bin/drive9 --home /out/home || rc=$?
              chmod -R a+rX /out/home 2>/dev/null || true
              exit $rc
            ' || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" != 0 ]; then docker kill sim-pjdfstest 2>/dev/null; exit $rc; fi

      - name: Benchmark tier + baseline comparison (G6, red on regression)
        run: |
          mkdir -p /tmp/d9-bench-out
          timeout -k 15 1800 docker run --rm --name sim-bench-tier \
            --privileged --device /dev/fuse \
            -v "$PWD:/repo" -v /tmp/d9-bench-out:/out \
            -v ~/.cache/drive9-simulator:/root/.cache/drive9-simulator \
            ubuntu:24.04 bash -c '
              set -x
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 curl python3 fio >/dev/null
              export D9_MOCK_SERVER_BIN=/repo/bin/drive9-mock-server D9_REPO=/repo
              export D9_FSTEST_BIN=/root/.cache/drive9-simulator/fstest/main/target/release/fstest
              cd /repo
              rc=0
              timeout -k 10 1650 simulator/target/release/drive9-simulator run-suite simulator/suites.toml \
                --tier bench --stack mock --bin /repo/bin/drive9 --home /out/home || rc=$?
              chmod -R a+rX /out/home 2>/dev/null || true
              exit $rc
            ' || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" != 0 ]; then docker kill sim-bench-tier 2>/dev/null; exit $rc; fi
          python3 simulator/scripts/perf_baseline.py \
            --artifacts /tmp/d9-bench-out \
            --baseline /tmp/perf-baseline.json \
            --out /tmp/perf-baseline.json.new \
            --threshold-pct 15
          mv /tmp/perf-baseline.json.new /tmp/perf-baseline.json

      - name: Save perf baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/perf-baseline.json
          key: perf-baseline-mock-${{ github.run_id }}

      - name: Upload run artifacts
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-e2e-artifacts
          path: |
            /tmp/d9-suite-home
            /tmp/d9-mount-out
            /tmp/d9-pjdf-out
            /tmp/d9-bench-out
            /tmp/drive9-simulator-suite-*
          if-no-files-found: ignore
